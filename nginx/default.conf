# 简历工坊对外入口：反向代理到 compose 网络里的 resume 服务。
# 由 docker-compose.yml 挂载到 /etc/nginx/conf.d/default.conf。
#
# 这里的每一项都不是可选的装饰，改之前先看理由：
#   resolver + 变量      —— 见下方说明，这是「重建容器后不 502」的关键；
#   client_max_body_size —— 后端 express.json 的上限是 8mb，nginx 默认只有 1m，
#                           不放开的话「保存带图片的简历」会被 nginx 拦成 413；
#   X-Forwarded-*        —— 后端靠它取真实客户端 IP 与实际协议（TRUST_PROXY=1）。
#                           缺了会让登录失败计数按 nginx 容器 IP 累加，一个人连错
#                           十次就把全站锁死；
#   上游读超时           —— 导出 PDF 要调 Chromium 渲染，小内存机器排队时可能几十秒，
#                           默认 60s 会在最需要等的时候返回 504。

server {
    listen 80;
    server_name _;

    # 不回显 nginx 版本号
    server_tokens off;

    # Docker 内置 DNS。写成 upstream { server resume:3001; } 的话，nginx 只在启动时
    # 解析一次并缓存结果，而每次 redeploy 重建 resume 容器都会换 IP —— 于是 nginx
    # 会一直往旧地址打，直到它自己被重启，表现为「部署成功了但全是 502」。
    # 配合下面的变量写法，nginx 就会按这个有效期重新解析，自己就跟上了。
    # （若给 compose 网络开了 IPv6，这里需要补 ipv6=off）
    resolver 127.0.0.11 valid=10s;

    # 必须 ≥ 后端的 8mb，否则 nginx 先于后端拒绝掉请求体
    client_max_body_size 8m;

    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # proxy_pass 带变量时用不上 upstream keepalive，这里清空 Connection，
    # 避免把客户端的长连接语义原样透传给后端
    proxy_set_header Connection "";

    # 服务名与端口来自 docker-compose.yml 的 resume 服务。
    # 必须写成变量：proxy_pass 里出现变量时才会走上面的 resolver 重新解析，
    # 写死成字面量的话 nginx 又回到「只在启动时解析一次」的老问题。
    set $resume_upstream "resume:3001";

    # 默认不缓存：入口 HTML 与 /api 响应都不该被浏览器存下来。
    # 发版后旧的 index.html 会去引用已删除的旧 chunk，页面直接白屏。
    # 注意：add_header 不会向下继承，下面 /assets/ 里自己又写了一条，
    # 正好顶掉这条——带哈希指纹的产物是唯一该被长期缓存的。
    add_header Cache-Control "no-cache";

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    # 只压文本类，PDF 本身已是压缩格式，再压是白烧 CPU
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 容器健康检查端点：不打到后端，也不写访问日志
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite 产物文件名带内容哈希，内容一变文件名就变，可以放心长期缓存
    location /assets/ {
        proxy_pass http://$resume_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余全部交给后端：/api/** 与 SPA 深层路由（/login 等）都是它处理的。
    # 变量写法里不带 URI，请求 URI 原样透传，与直接写死地址等价。
    location / {
        proxy_pass http://$resume_upstream;
    }
}


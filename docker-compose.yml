# 一键部署：docker compose up -d --build
# 访问：http://服务器IP（默认 80 端口，由 nginx 容器反向代理到应用容器）
#
# 对外形态：nginx（容器，占宿主机端口）→ resume（容器，只在 compose 网络内可见）
#
# 可用环境变量（不设也能起，但公网访问会 403，见下方 ALLOWED_ORIGINS 注释）：
#   ALLOWED_ORIGINS       浏览器访问地址，逗号分隔，如 http://1.2.3.4,https://resume.example.com
#   NGINX_HTTP_PORT       nginx 对外端口，默认 80
#   NGINX_IMAGE           nginx 镜像，默认 nginx:alpine（拉不动时换成镜像站地址）
#   NPM_REGISTRY          构建期 npm 源，默认空（走官方源）
#   COMPOSE_PROJECT_NAME  项目名，脚本固定成 resume（避免目录名带中文/大写直接报错）
#
# 这些变量由 deploy-docker.sh 注入（它用 env 显式传递，因为 sudo 会重置环境）。
# 手动部署时自己带齐，并统一加 -p resume，否则 compose 按目录名算项目名、找不到这套容器：
#   sudo env ALLOWED_ORIGINS=http://1.2.3.4 docker compose -p resume up -d --build
#
# 2G 内存机器的必要调整：
#   1. 先加 swap（2G），见 DEPLOY.md「小内存机器」一节；
#   2. RENDER_CONCURRENCY 保持 1（默认即 1），不要调大；
#   3. 可选：放开下方 mem_limit，防止渲染峰值吃光宿主机内存触发 OOM。

services:
  resume:
    build:
      context: .
      args:
        # 国内 npm 拉包加速；默认空 = 与不带 build args 时行为完全一致
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: resume-studio
    restart: unless-stopped

    # 不再映射到宿主机：外部流量统一从 nginx 进。
    # 需要直连调试时：docker compose exec resume node -e "fetch('http://127.0.0.1:3001/api/health')..."
    expose:
      - "3001"

    environment:
      HOST: 0.0.0.0
      PORT: 3001

      # 前面有一层 nginx，必须信任代理头。不设的后果：
      #   1. req.ip 全是 nginx 容器 IP → 登录失败按「IP+用户名」计数，一个人连错十次会把全站锁死；
      #   2. req.secure 恒为 false → 上了 TLS 之后会话 Cookie 也不会带 Secure。
      TRUST_PROXY: "1"

      # 放行浏览器 Origin（http://公网IP、https://域名，逗号分隔）。
      # 留空时只允许 localhost，公网访问的登录与导出会全部 403。
      # deploy-docker.sh 会自动探测公网 IP 写入；手动部署时自己 export 这个变量。
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

      # 登录/注册弹窗交互开关（默认开启）：off 时前端改为跳转独立登录页。
      # 在 .env 里写 AUTH_POPUP=off 即可生效，无需重建镜像。
      AUTH_POPUP: ${AUTH_POPUP:-}

      # 导出额度：每用户每日 / 全站每日兜底
      PDF_USER_DAILY_LIMIT: 10
      PDF_DAILY_LIMIT: 100

      # 渲染并发。2G 内存机器务必保持 1；4G 及以上可考虑 2
      RENDER_CONCURRENCY: 1
      RENDER_QUEUE_MAX: 3

      # 容器内没有 user namespace，Chromium 自带沙箱起不来，必须 no-sandbox。
      # 风险已被收窄：渲染进程只加载应用自身源、外联全部被断、入参全量清洗。
      # 自建内核支持 userns 或换用物理机部署时，删掉这一行更稳。
      BROWSER_EXTRA_ARGS: --no-sandbox

      # TRUST_PROXY 与 ALLOWED_ORIGINS 已在上方设置，理由见那两处注释

      # 可选：脚本调 /api/pdf 的 Bearer 通道
      # PDF_ACCESS_PASSWORD: change-me

    volumes:
      # SQLite（账号、简历、配额）持久化，容器重建不丢数据
      - resume-data:/app/server/.data

    # Chromium 共享内存：默认 64MB 不够渲染大图，给到 256m。
    # （应用已加 --disable-dev-shm-usage 兜底，这里是让渲染走得更稳）
    shm_size: 256m

    # 2G 内存机器建议放开：给容器封顶 1.5G，峰值越界只会容器内 429/失败，
    # 不会拖死宿主机上其他服务
    # mem_limit: 1536m

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 对外入口：nginx 反向代理。端口、TLS 终止、真实客户端 IP、缓存策略都在这一层。
  # 配置见 nginx/default.conf，改完执行 docker compose restart nginx 即生效。
  nginx:
    # 拉不动 Docker Hub 时换成镜像站地址，如 NGINX_IMAGE=registry.example.com/nginx:alpine
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: resume-nginx
    restart: unless-stopped

    ports:
      # 对外只开这一个口。
      # 想退回「宿主机自己装 nginx 做反代」的形态，改成 "127.0.0.1:${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTP_PORT:-80}:80"

    volumes:
      # 只挂配置文件，不挂整个目录：应用镜像里既不需要它，也不该看到仓库结构。
      # 末尾的 z 是给 CentOS 的 SELinux 用的——enforcing 下不标 container_file_t 会读不到文件。
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
      # 要上 HTTPS 时：证书放 nginx/certs/（fullchain.pem + privkey.pem，权限 600），
      # 取消下面这行注释，再按 nginx/default.conf 末尾的说明放开 443 的 server 块
      # - ./nginx/certs:/etc/nginx/certs:ro,z

    depends_on:
      # 等后端健康检查通过再启动，避免部署完的第一个请求就吃一个 502
      resume:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  resume-data:

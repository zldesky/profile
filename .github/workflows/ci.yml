name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 前端与 PDF 服务是两份独立依赖，都要装：
      # 根目录跑测试与构建，server/ 的依赖问题也要在 CI 里暴露
      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      # 类型检查必须单独跑：Vite 构建只转译不做类型校验，类型错误不会让 Build 失败，
      # 少了这一步 TS 迁移就形同虚设（错的类型照样能合进 main）
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # .agent/ 是给 AI 协作者读的文档，过期比缺失更危险（会让 AI 产生"幻读"）。
      # 这一步只核对可机械验证的部分：链接可达、脚本存在、关键约定仍在代码里成立。
      - name: Check agent docs
        run: npm run check:agent-docs
